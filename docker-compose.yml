services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campusconnect
    ports:
      - "5432:5432"
    volumes:
      - campusconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campusconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusconnect_pgdata:
